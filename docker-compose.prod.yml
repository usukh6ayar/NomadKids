# Production, on a single Datacom VPS.
#
# ★ Everything the platform used to do is now a service in here. Railway
# supplied managed Postgres, managed Redis, TLS certificates, restarts and
# nightly backups; four of those five are below and the fifth — backups — is
# `scripts/backup.sh` on a cron, because a compose file cannot express it.
#
# ★★ **Only Caddy publishes a port.** Postgres, Redis and MinIO are reachable
# on the compose network by service name and are never bound to the host. That
# is the single most important line in this file: a Postgres bound to 0.0.0.0
# on a public VPS is found by a scanner within hours, and the default in most
# compose examples is exactly that.
#
# Run:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See docs/VPS_DEPLOYMENT.md for the full sequence, and run
# `scripts/vps-preflight.sh` on the server before the first deploy.

name: nomadkids

services:
  # ── Edge ───────────────────────────────────────────────────────────────────
  #
  # ★ Caddy rather than nginx + certbot. It obtains and renews certificates by
  # itself from the hostnames in the Caddyfile, which removes the one piece of
  # this stack that fails silently ninety days after somebody sets it up and
  # forgets the renewal cron.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — losing this means re-issuing them
      - caddy_config:/config
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      # ★ Without this the Caddyfile's `email {$ACME_EMAIL}` expands to nothing
      # and Caddy refuses the whole config with "wrong argument count after
      # 'email'" — a restart loop with no TLS, found on the first real deploy.
      ACME_EMAIL: ${ACME_EMAIL}
      WWW_DOMAIN: ${WWW_DOMAIN}
      WWW_REDIRECT_TO: ${WWW_REDIRECT_TO}
    depends_on:
      - web
      - api
    networks: [edge, internal]

  # ── Application ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # ★ Build arguments, not environment. Next inlines NEXT_PUBLIC_* into
        # the bundle at build time — setting them below would change nothing.
        #
        # ★★ The canonical origins, **not** `https://${API_DOMAIN}`.
        # `*_DOMAIN` are Caddy site addresses and may be comma-separated lists;
        # a list interpolated here produces `https://a.example, b.example`,
        # which is not a URL. See `.env.production.example`.
        NEXT_PUBLIC_API_URL: ${API_ORIGIN}
        NEXT_PUBLIC_MEDIA_URL: ${MEDIA_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${WEB_ORIGIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks: [internal]

  # ── The API ────────────────────────────────────────────────────────────────
  #
  # ★ Runs as N processes since 2026-09-05 — Order А/261, criterion 6 (20,000
  # concurrent users). `docs/LOAD_TEST.md` measured the ceiling and named the
  # cause: one Node process is one core, whatever the machine has.
  #
  # Two things had to be true before this was safe, and both now are:
  #
  #   1. **Rate limiting counts in Redis**, not in process memory. In memory,
  #      N processes meant N× the configured limit — a documented 5 login
  #      attempts silently behaving like 10. `rate-limit.service.ts`.
  #   2. **PDF generation moved to its own container** (below). Chromium's 1 GB
  #      floor is a poor reason to size every API instance for it, which is the
  #      split `reports.queue.ts` was written to make possible.
  #
  # Migrations are safe under replicas: the entrypoint runs `prisma migrate
  # deploy`, which takes an advisory lock, so the second replica waits and then
  # finds nothing to do.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Service names on the compose network. These override whatever the env
      # file carries, so a copied localhost URL cannot survive into production.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # ★ The API signs presigned URLs against the PUBLIC hostname, because the
      # browser is what follows them. `http://storage:9000` would be signed
      # correctly and unreachable from anywhere but this network.
      # ★★ `MEDIA_ORIGIN`, not `https://${MEDIA_DOMAIN}` — a signature is
      # computed over the host, so a comma-separated Caddy list here would be
      # signed faithfully and then rejected by every browser that followed it.
      STORAGE_ENDPOINT: ${MEDIA_ORIGIN}
      NODE_ENV: production
      PORT: "3001"
      # ★ Explicitly off, overriding whatever `.env.production` carries.
      #
      # It shipped as `true` when one container did everything, and a copied
      # value surviving into a replica is the failure this whole block exists
      # to avoid: N Chromiums in N 512 MB containers, each OOM-killed mid-render
      # and restarted, on a queue that never drains.
      REPORTS_WORKER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    # ★ 512 MB per replica, not 2 GB.
    #
    # The old limit existed because this container also rendered PDFs; Chromium
    # needs 1 GB (docs/PDF_SPIKE.md §3) and an OOM kill would have taken the
    # API with it. That work now lives in `reports-worker`, so an API replica
    # is sized for what it actually does — serving requests.
    #
    # ★★ `API_REPLICAS` defaults to 2, which is what the current VPS has room
    # for. Raising it is the lever criterion 6 asks for: `docs/LOAD_TEST.md`
    # measured a single process, and the ceiling scales with cores until
    # Postgres becomes the limit. Re-measure before claiming a number.
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks: [internal]

  # ── The report worker ──────────────────────────────────────────────────────
  #
  # ★ The same image as the API, with the queue consumer switched on and the
  # HTTP surface unused. `reports.queue.ts` predicted this container: "Split
  # from the worker so that the API can enqueue without ever running a job.
  # That separation is what makes it a configuration change rather than a
  # rewrite when PDF generation needs its own container."
  #
  # ★★ **Exactly one replica, on purpose.** BullMQ hands a job to one consumer,
  # so several would be correct — but each holds a Chromium, and 1 GB apiece is
  # the whole reason this is not part of the API. Reports are minutes-tolerant;
  # a queue that drains slightly slower is the right trade against a machine
  # that swaps.
  reports-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: ${MEDIA_ORIGIN}
      NODE_ENV: production
      PORT: "3001"
      # ★ The one setting that distinguishes this container from `api`.
      REPORTS_WORKER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    # Chromium's floor is measured, not guessed: 384 MB fails, 512 MB works,
    # 1 GB is the documented requirement (docs/PDF_SPIKE.md §3).
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    # Chromium writes to /dev/shm, and the Docker default of 64 MB makes it
    # crash on a page with several images — a report that fails only for the
    # families with the most photographs.
    shm_size: 512mb
    networks: [internal]

  # ── Data ───────────────────────────────────────────────────────────────────
  #
  # None of these publish a port. They are reachable only from `internal`.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Backups land on the host so that `docker compose down -v` cannot take
      # them with it — the one command most likely to be typed in a hurry.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ★ BullMQ's queue is durable state, not a cache. Without persistence, a
    # restart loses every queued report — the jobs stay QUEUED in Postgres for
    # ever and nobody is told why.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
      # Presigned URLs must be signed for the hostname the browser will use.
      MINIO_SERVER_URL: https://${MEDIA_DOMAIN}
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ── One-shot: create the bucket ────────────────────────────────────────────
  #
  # ★ `restart: "no"` and it exits. MinIO has no "create this bucket at boot"
  # setting, and the alternative is a manual step somebody performs once and
  # nobody records — then a fresh server 404s every upload with no clue why.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$STORAGE_ACCESS_KEY_ID $$STORAGE_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc anonymous set none local/$$STORAGE_BUCKET &&
      mc version enable local/$$STORAGE_BUCKET &&
      echo 'bucket ready, private, versioned'
      "
    restart: "no"
    networks: [internal]

networks:
  # Only Caddy sits on both. Nothing else can be reached from outside.
  edge:
  internal:
    internal: false # the API needs outbound HTTPS for QPay and ESIS

volumes:
  pgdata:
  redisdata:
  storagedata:
  caddy_data:
  caddy_config:
