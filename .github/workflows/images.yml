name: Images

# ★ The production images are built here, not on the VPS (2026-10-27).
#
# Building api, reports-worker and web on the 4 GB server ran it out of memory:
# the kernel OOM-killed the live web and worker mid-deploy and the API answered
# 502 for minutes. GitHub's runner builds; the server only pulls and swaps,
# which takes a couple of minutes and no memory to speak of.
#
# One image per Dockerfile: `api` serves both the API and `reports-worker`.
# Tagged with the commit and with `main`. Deploy: `scripts/deploy.sh` on the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lower case; the owner may not be.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/nomadkids-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/nomadkids-${{ matrix.name }}:main
          # ★ Inlined into the web bundle at build time, so they are fixed here
          # rather than read on the server. Public values — they are in every
          # browser that loads the site. Repository variables override them.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN || 'https://api.nomadkids.mn' }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.MEDIA_ORIGIN || 'https://media.nomadkids.mn' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.WEB_ORIGIN || 'https://nomadkids.mn' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
