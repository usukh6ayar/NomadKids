name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ★ The API's tests run against a real database, a real Redis and real
    # object storage — deliberately, because the thing under test is whether an
    # *endpoint* enforces authorization, and a mocked repository would prove
    # only that the mock works (CLAUDE.md §4.1).
    #
    # That means CI needs the same three services `docker-compose.yml` provides
    # locally. Without them `pnpm test` cannot run at all, which is how this
    # workflow spent weeks reporting a red X that nobody could act on.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kinder
          POSTGRES_PASSWORD: kinder
          POSTGRES_DB: kinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # ★ Object storage is NOT a service container — see the step that starts
      # it. `services:` cannot pass a command, and `minio/minio` needs
      # `server /data` to do anything.

    # ★ Not secrets, and deliberately inline.
    #
    # These are throwaway values for containers that live five minutes and are
    # unreachable from outside the runner. Putting them in GitHub secrets would
    # imply they protect something, and would make a green build depend on
    # repository settings nobody can see in review. The real secrets live on
    # Railway and Vercel.
    #
    # `loadEnv()` validates all of them at boot, which is why every one is here
    # rather than only the ones a given step happens to need.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kinder:kinder@localhost:5432/kinder
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      # 32-character floor, and the two must differ — `loadEnv` refuses
      # identical signing secrets.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-key-000000
      REFRESH_SECRET: ci-only-refresh-secret-not-a-real-key-11
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: auto
      STORAGE_BUCKET: kinder-media
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      # The report worker never runs in tests: a background consumer draining
      # the queue would race every assertion about a job's status.
      REPORTS_WORKER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        # Types from the generated client are needed before anything typechecks.
        #
        # ★ This step is why CI was red from 2026-08-19 to 2026-08-21.
        # `prisma.config.ts` resolves the datasource through `env()`, which
        # throws when DATABASE_URL is unset — and `.env` is gitignored, so it
        # never existed on a runner. The Dockerfile had already hit this and
        # solved it with a build-stage placeholder; CI never got the same fix,
        # so every run died here, 32 seconds in, long before reaching the
        # Prisma-boundary test that CLAUDE.md §2.2 says CI enforces.
        #
        # No placeholder is needed now: the Postgres service means DATABASE_URL
        # is a real, reachable database for every step.
        run: pnpm --filter @kinder/api prisma:generate

      - name: Build the contracts package
        # apps/* import its compiled output, so it must exist first.
        run: pnpm --filter @kinder/contracts build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Start object storage
        # ★ Started here rather than under `services:`, because a service
        # container cannot be given a command and `minio/minio` needs
        # `server /data`.
        #
        # The first attempt used `bitnami/minio`, which starts the server itself
        # and seeds a bucket from an env var — but that tag no longer exists
        # ("manifest unknown"), and reaching for a vendor's convenience image to
        # dodge a `services:` limitation was the wrong trade anyway. This runs
        # the *same image docker-compose uses locally*, so CI and a developer
        # machine exercise identical storage.
        #
        # The bucket is created explicitly: nothing in the application creates
        # it — `StorageService` only ever calls `HeadBucket`.
        run: |
          set -euo pipefail

          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

          # Polled from the runner: the image has no shell tool to health-check
          # with. Failing here with a clear message beats a media test failing
          # on a socket error thirty seconds later.
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              docker run --rm --network host --entrypoint sh minio/mc:latest -c \
                "mc alias set ci http://localhost:9000 minioadmin minioadmin \
                 && mc mb --ignore-existing ci/kinder-media"
              echo "storage ready, bucket created"
              exit 0
            fi
            sleep 2
          done

          echo "object storage did not become ready" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Install Chrome, the Cyrillic fonts and poppler
        # ★ The report tests render real PDFs and assert on extracted text.
        #
        # `docs/PDF_SPIKE.md` §4 is the reason they do: a generator returning a
        # megabyte of blank pages passes every "did it produce a file" check.
        # Asserting on the text means the run needs a browser and needs fonts
        # that cover Cyrillic — without them the assertion fails on tofu, which
        # is exactly the failure it exists to catch.
        #
        # The Dockerfile does the same two things (apt `chromium`, plus
        # `assets/fonts` copied into /usr/share/fonts). Puppeteer's own download
        # is used here instead of apt: on ubuntu-latest `chromium` is a snap,
        # which does not run in this environment.
        run: |
          set -euo pipefail

          # `pdftotext` is how the report tests read the PDF back. Asserting on
          # extracted text rather than on a file existing is CLAUDE.md §4.3, and
          # it is the only check that can tell a real report from a megabyte of
          # blank pages.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

          pnpm --filter @kinder/api exec puppeteer browsers install chrome
          sudo mkdir -p /usr/share/fonts/truetype/kinder
          sudo cp apps/api/assets/fonts/*.ttf /usr/share/fonts/truetype/kinder/
          sudo fc-cache -f
          fc-list | grep -ci "noto sans" || (echo "fonts did not register" >&2; exit 1)

      - name: Apply migrations
        # The integration suite truncates between cases; the tables have to
        # exist first. `deploy` rather than `dev` — it applies what is committed
        # and never generates a new migration, so a drifted schema fails CI
        # instead of being silently patched over.
        run: pnpm --filter @kinder/api exec prisma migrate deploy

      - name: Test
        # Includes the Prisma-boundary test — the check that stops a service
        # reaching past the repository layer. See CLAUDE.md §2.2.
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check
